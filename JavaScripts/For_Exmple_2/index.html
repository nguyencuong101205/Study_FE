<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Validation - F8</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <div class="main">
      <form action="" method="POST" class="form" id="form-1">
        <h3 class="heading">SIGN UP</h3>
        <p class="desc">\Welcome to the Bear/</p>

        <div class="spacer"></div>

        <div class="form-group">
          <label for="fullname" class="form-label">NameFull</label>
          <input
            id="fullname"
            name="fullname"
            type="text"
            placeholder="VD: Bear Bear"
            class="form-control"
          />
          <span class="form-message"></span>
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <input
            id="email"
            name="email"
            type="text"
            placeholder="VD: email@domain.com"
            class="form-control"
          />
          <span class="form-message"></span>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            placeholder="Password"
            class="form-control"
          />
          <span class="form-message"></span>
        </div>

        <div class="form-group">
          <label for="password_confirmation" class="form-label"
            >Password Confirmation</label
          >
          <input
            id="password_confirmation"
            name="password_confirmation"
            placeholder="Password Confirmation"
            type="password"
            class="form-control"
          />
          <span class="form-message"></span>
        </div>

        <div class="form-group">
          <label for="province" class="form-label">Location</label>
          <select id="province" name="province" class="form-control">
            <option value="">-- Location --</option>
            <option value="hanoi">HaNoi</option>
            <option value="hcm">TP. Ho Chi Minh</option>
            <option value="danang">Da Nang</option>
            <option value="cantho">Can Tho</option>
          </select>
          <span class="form-message"></span>
        </div>

        <div class="form-group">
          <label class="form-label">Gender</label>
          <div class="form-group-options">
            <div class="form-option-item">
              <input name="gender" type="radio" value="male" id="gender-male" />
              <label for="gender-male">Male</label>
            </div>
            <div class="form-option-item">
              <input
                name="gender"
                type="radio"
                value="female"
                id="gender-female"
              />
              <label for="gender-female">Female</label>
            </div>
            <div class="form-option-item">
              <input
                name="gender"
                type="radio"
                value="other"
                id="gender-other"
              />
              <label for="gender-other">Other</label>
            </div>
          </div>
          <span class="form-message"></span>
        </div>

        <div class="form-group">
          <label class="form-label">Hobbies</label>
          <div class="form-group-options">
            <div class="form-option-item">
              <input
                name="hobbies"
                type="checkbox"
                value="coding"
                id="hobby-coding"
              />
              <label for="hobby-coding">Coding</label>
            </div>
            <div class="form-option-item">
              <input
                name="hobbies"
                type="checkbox"
                value="music"
                id="hobby-music"
              />
              <label for="hobby-music">Music</label>
            </div>
            <div class="form-option-item">
              <input
                name="hobbies"
                type="checkbox"
                value="sports"
                id="hobby-sports"
              />
              <label for="hobby-sports">Sports</label>
            </div>
          </div>
          <span class="form-message"></span>
        </div>

        <button type="submit" class="form-submit">Sign Up</button>
      </form>
    </div>

    <script src="./main.js"></script>
    <script>
      Validator({
        form: "#form-1",
        formGroupSelector: ".form-group",
        errorSelector: ".form-message",
        rules: [
          Validator.isRequired("#fullname", "Vui lòng nhập tên đầy đủ của bạn"),
          Validator.isRequired("#email", "Vui lòng nhập email"),
          Validator.isEmail("#email", "Trường này phải là email"),
          Validator.isRequired("#password", "Vui lòng nhập mật khẩu"),
          Validator.minLength(
            "#password",
            6,
            "Vui lòng nhập tối thiểu 6 kí tự",
          ),
          Validator.isRequired(
            "#password_confirmation",
            "Vui lòng nhập lại mật khẩu",
          ),
          Validator.isConfirmed(
            "#password_confirmation",
            function () {
              return document.querySelector("#form-1 #password").value;
            },
            "Mật khẩu nhập lại không chính xác",
          ),
          Validator.isRequired("#province", "Vui lòng chọn Tỉnh/TP"),
          Validator.isRequired(
            'input[name="gender"]',
            "Vui lòng chọn giới tính",
          ),
          Validator.isRequired(
            'input[name="hobbies"]',
            "Vui lòng chọn ít nhất một sở thích",
          ),
        ],
        onSubmit: function (data) {
          console.log("Dữ liệu form hợp lệ:", data);
          alert("Đăng ký thành công!\n\n" + JSON.stringify(data, null, 2));
        },
      });
    </script>
  </body>
</html>
